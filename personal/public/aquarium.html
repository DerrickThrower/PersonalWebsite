<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Aquarium — Derrick Thrower</title>
<meta name="description" content="Submerged. Caustics on the sand, kelp swaying, jellyfish drifting through the light." />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#04141C; --ink:#DFF3F0; --muted:#5E8E93; --accent:#67E8D0;
  --display:"Space Grotesk",Arial,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  --pad:clamp(16px,3.2vw,34px);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono);
  overflow:hidden; overscroll-behavior:none; -webkit-font-smoothing:antialiased; }
body.fallback{ overflow:auto; }
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }

#stage{ position:fixed; inset:0; }
body.fallback #stage{ display:none; }
#gl{ display:block; width:100%; height:100%; touch-action:none; }

/* the water column: cool at depth, brighter toward the surface */
#watertint{ position:fixed; inset:0; z-index:3; pointer-events:none;
  background:linear-gradient(to bottom, rgba(90,210,220,.16), rgba(4,20,28,0) 46%, rgba(2,10,18,.30));
  mix-blend-mode:screen; }
#vignette{ position:fixed; inset:0; z-index:4; pointer-events:none;
  background:radial-gradient(118% 88% at 50% 38%, rgba(0,0,0,0) 32%, rgba(1,12,18,.55) 72%, rgba(1,8,12,.94) 100%); }
#curtain{ position:fixed; inset:0; z-index:60; background:#02090E; pointer-events:none;
  opacity:1; transition:opacity 1000ms ease 100ms; }
body.lit #curtain{ opacity:0; }
body.leaving #curtain{ opacity:1; transition:opacity 400ms ease; }

#topbar{ position:fixed; z-index:20; inset:0 0 auto 0; padding:var(--pad);
  padding-top:max(var(--pad),env(safe-area-inset-top));
  display:flex; justify-content:space-between; align-items:baseline; gap:1rem; pointer-events:none; }
#topbar > *{ pointer-events:auto; }
.mark{ font-family:var(--display); font-weight:700; font-size:clamp(15px,2.1vw,20px);
  letter-spacing:.13em; text-transform:uppercase; margin:0; }
.mark small{ display:block; font-family:var(--mono); font-size:11px; font-weight:400;
  letter-spacing:.11em; color:var(--muted); text-transform:uppercase; margin-top:.35em; }

#footline{ position:fixed; z-index:20; inset:auto 0 0 0;
  bottom:max(var(--pad),env(safe-area-inset-bottom)); padding:0 var(--pad);
  text-align:center; pointer-events:none; }
#caption{ font-family:var(--mono); font-size:clamp(11px,1.5vw,13px); letter-spacing:.18em;
  text-transform:uppercase; margin:0 0 .5rem; }
#hint{ font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); margin:0; }

#spec-list{ position:fixed; inset:0; z-index:10; margin:0; padding:0; list-style:none; pointer-events:none; }
#spec-list li{ position:absolute; left:0; top:0; }
.room-btn{ display:block; width:100%; height:100%; padding:0; margin:0; background:none;
  border:1px solid transparent; border-radius:50%; cursor:pointer; pointer-events:auto;
  color:inherit; font:inherit; transition:border-color 160ms; }
.room-btn:hover{ border-color:rgba(103,232,208,.4); }
.room-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

#plate{ position:fixed; z-index:14; left:50%; transform:translateX(-50%);
  bottom:calc(max(var(--pad),env(safe-area-inset-bottom)) + 3.4rem);
  width:min(30rem,90vw); text-align:center;
  opacity:0; visibility:hidden; transition:opacity 260ms ease; pointer-events:none; }
#plate.show{ opacity:1; visibility:visible; }
#plate .p-name{ font-family:var(--display); font-weight:700; font-size:1.25rem; margin:0 0 .2rem; }
#plate .p-latin{ font-family:var(--body); font-style:italic; font-size:.95rem;
  color:var(--accent); margin:0 0 .5rem; }
#plate .p-note{ font-family:var(--body); font-size:1rem; line-height:1.55; color:#BEDCDA; margin:0; }

#fallback-note{ display:none; }
body.fallback #watertint, body.fallback #vignette, body.fallback #curtain,
body.fallback #footline, body.fallback #plate{ display:none; }
body.fallback #topbar{ position:static; }
body.fallback #fallback-note{ display:block; max-width:56rem; margin:0 auto;
  padding:1.4rem var(--pad) 0; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); }
body.fallback #spec-list{ position:static; display:grid; gap:.6rem; max-width:56rem;
  margin:1rem auto 4rem; padding:0 var(--pad); pointer-events:auto; }
body.fallback #spec-list li{ position:static; }
body.fallback .room-btn{ height:auto; text-align:left; cursor:default; border-radius:2px;
  border:1px solid rgba(255,255,255,.08); padding:1.2rem 1.3rem;
  background:linear-gradient(170deg,#07202B,#04141C); }
body.fallback .sr{ position:static; width:auto; height:auto; margin:0; overflow:visible;
  clip:auto; clip-path:none; white-space:normal; }
body.fallback .s-name{ display:block; font-family:var(--display); font-weight:700; font-size:1.2rem; }
body.fallback .s-latin{ display:block; font-family:var(--body); font-style:italic;
  color:var(--accent); margin-top:.2rem; }
body.fallback .s-note{ display:block; font-family:var(--body); color:#BEDCDA; margin-top:.5rem; font-size:1rem; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body>

<header id="topbar">
  <h1 class="mark">Aquarium<small>Hover a specimen</small></h1>
  <nav id="roomnav" aria-label="Rooms"></nav>
</header>

<div id="stage" aria-hidden="true"><canvas id="gl"></canvas></div>
<div id="watertint" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="curtain" aria-hidden="true"></div>

<main>
  <p id="fallback-note">WebGL unavailable — showing the plain text edition.</p>
  <h2 class="sr">Specimens</h2>
  <ul id="spec-list"><!-- built from SPECIMENS --></ul>
</main>

<div id="plate" aria-hidden="true"></div>

<div id="footline">
  <p id="caption"></p>
  <p id="hint">move to look around &middot; hover a jellyfish</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/room-nav.js"></script>
<script src="/room-kit.js"></script>
<script>
/* =====================================================================
   AQUARIUM
   Submerged. Caustics are drawn on a canvas and laid over the sand as an
   additive plane — r128's core build has no shader chain to do them
   properly, and a sum of sines reads fine at this depth of field.
   ===================================================================== */

const K = window.RoomKit;

const SPECIMENS = [
  { name:"Moon Jelly", latin:"Aurelia aurita", color:0x8FF0E4,
    note:"Ninety-five percent water. No brain, no heart, no blood — and it has been doing fine like that for five hundred million years." },
  { name:"Lion's Mane", latin:"Cyanea capillata", color:0xFFB08A,
    note:"Tentacles that can trail thirty metres behind the bell, which makes it about as long as anything alive." },
  { name:"Crystal Jelly", latin:"Aequorea victoria", color:0x9FD8FF,
    note:"The source of green fluorescent protein — the glow that half of modern cell biology borrows to see what it's doing." },
  { name:"Sea Nettle", latin:"Chrysaora fuscescens", color:0xFFD08A,
    note:"Drifts with the current rather than against it, and eats whatever the current happens to deliver." }
];

const listEl = document.getElementById("spec-list");
const btns = K.buildList(SPECIMENS, listEl, (sr, s) => {
  sr.innerHTML = '<span class="s-name"></span><span class="s-latin"></span><span class="s-note"></span>';
  sr.querySelector(".s-name").textContent = s.name;
  sr.querySelector(".s-latin").textContent = s.latin;
  sr.querySelector(".s-note").textContent = s.note;
});

let renderer, scene, camera, clock, projector;
let jellies = [], kelps = [], fish = [], bubbleGeo, causticTex, causticData, causticCanvas;
let godrays = [];
const caption = document.getElementById("caption");
const plate = document.getElementById("plate");
let focusIdx = 0;

/* ---- caustics: sum of sines, close enough at this scale ---- */
const CAU = 128;
function makeCaustic(){
  causticCanvas = document.createElement("canvas");
  causticCanvas.width = causticCanvas.height = CAU;
  const ctx = causticCanvas.getContext("2d");
  causticData = ctx.createImageData(CAU, CAU);
  causticTex = new THREE.CanvasTexture(causticCanvas);
  causticTex.wrapS = causticTex.wrapT = THREE.RepeatWrapping;
  /* the floor is 70 units across — the pattern has to tile often enough that
     a filament is a few units wide, or it reads as flat colour */
  causticTex.repeat.set(11, 11);
  return { ctx };
}
function paintCaustic(ctx, t){
  const d = causticData.data;
  for (let y = 0; y < CAU; y++){
    for (let x = 0; x < CAU; x++){
      const v =
        Math.sin(x * 0.098 + t * 0.9) +
        Math.sin(y * 0.113 - t * 0.75) +
        Math.sin((x + y) * 0.071 + t * 1.25) +
        Math.sin(Math.hypot(x - 64, y - 64) * 0.125 - t * 1.5);
      let i = Math.max(0, v * 0.25 + 0.5);
      i = i * i * i;                       // tighten into filaments
      const k = (y * CAU + x) * 4;
      d[k] = 150 + i * 105; d[k+1] = 240; d[k+2] = 230;
      d[k+3] = Math.min(255, i * 255);
    }
  }
  ctx.putImageData(causticData, 0, 0);
  causticTex.needsUpdate = true;
}

function init(){
  renderer = K.makeRenderer(document.getElementById("gl"), { exposure: 1.05 });
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x04141C);
  scene.fog = new THREE.FogExp2(0x063040, 0.085);
  camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 90);
  clock = new THREE.Clock();
  projector = new K.Projector(camera);

  scene.add(new THREE.AmbientLight(0x2E6E7A, 1.5));
  const surface = new THREE.DirectionalLight(0xBFFFF4, 1.5);
  surface.position.set(-1.5, 8, 2.5);
  scene.add(surface);
  const deep = new THREE.PointLight(0x2F8FA8, 2.2, 22, 2);
  deep.position.set(3.5, 1.2, -5);
  scene.add(deep);

  buildFloor(); buildGodrays(); buildKelp(); buildJellies(); buildSchool(); buildBubbles();
  K.linearize(scene);
  layout();
  addEventListener("resize", layout, { passive:true });
  document.body.classList.add("lit");
  setCaption(0);
  renderer.setAnimationLoop(tick);
}

function buildFloor(){
  const sand = new THREE.Mesh(
    new THREE.PlaneGeometry(70, 70),
    new THREE.MeshStandardMaterial({ color:0x0E3742, roughness:0.95 })
  );
  sand.rotation.x = -Math.PI/2;
  scene.add(sand);

  const c = makeCaustic();
  paintCaustic(c.ctx, 0);
  causticCtx = c.ctx;
  const caustic = new THREE.Mesh(
    new THREE.PlaneGeometry(70, 70),
    new THREE.MeshBasicMaterial({ map:causticTex, transparent:true, opacity:0.60,
      blending:THREE.AdditiveBlending, depthWrite:false })
  );
  caustic.rotation.x = -Math.PI/2;
  caustic.position.y = 0.02;
  scene.add(caustic);

  /* a few rocks so the sand isn't an empty plane */
  const rock = new THREE.MeshStandardMaterial({ color:0x0A2A33, roughness:1 });
  for (let i = 0; i < 9; i++){
    const r = 0.25 + Math.random()*0.55;
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 5), rock);
    m.position.set((Math.random()-.5)*16, r*0.35, -1 - Math.random()*9);
    m.scale.y = 0.5 + Math.random()*0.3;
    scene.add(m);
  }
}
let causticCtx;

/* shafts of surface light: additive open cones, very low opacity */
function buildGodrays(){
  const cv = document.createElement("canvas");
  cv.width = 32; cv.height = 128;
  const g = cv.getContext("2d");
  const grad = g.createLinearGradient(0,0,0,128);
  grad.addColorStop(0, "rgba(190,255,245,.55)");
  grad.addColorStop(.55, "rgba(160,240,235,.14)");
  grad.addColorStop(1, "rgba(140,220,220,0)");
  g.fillStyle = grad; g.fillRect(0,0,32,128);
  const tex = new THREE.CanvasTexture(cv);

  for (let i = 0; i < 6; i++){
    const m = new THREE.Mesh(
      new THREE.CylinderGeometry(0.10, 1.5 + Math.random()*0.9, 9, 12, 1, true),
      new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:0.13,
        blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide })
    );
    m.position.set((Math.random()-.5)*13, 4.4, -2 - Math.random()*8);
    m.rotation.z = (Math.random()-.5)*0.24;
    scene.add(m);
    godrays.push({ mesh:m, phase:Math.random()*6.28, baseX:m.position.x });
  }
}

/* kelp: one plane per blade, vertices displaced each frame so it sways */
function buildKelp(){
  const mat = new THREE.MeshStandardMaterial({
    color:0x1E6B4E, roughness:0.85, side:THREE.DoubleSide,
    transparent:true, opacity:0.94
  });
  for (let i = 0; i < 14; i++){
    const h = 2.6 + Math.random()*2.6;
    const geo = new THREE.PlaneGeometry(0.22 + Math.random()*0.12, h, 1, 14);
    const m = new THREE.Mesh(geo, mat);
    m.position.set((Math.random()-.5)*15, h/2, -1.5 - Math.random()*9);
    m.rotation.y = Math.random()*Math.PI;
    scene.add(m);
    kelps.push({ mesh:m, h, phase:Math.random()*6.28, base:geo.attributes.position.array.slice() });
  }
}

function makeJelly(spec){
  const g = new THREE.Group();
  const bell = new THREE.Mesh(
    new THREE.SphereGeometry(0.42, 20, 14, 0, Math.PI*2, 0, Math.PI*0.55),
    new THREE.MeshStandardMaterial({
      color:spec.color, emissive:spec.color, emissiveIntensity:0.35,
      roughness:0.25, transparent:true, opacity:0.55, side:THREE.DoubleSide })
  );
  g.add(bell);
  const tent = [];
  const tmat = new THREE.MeshStandardMaterial({
    color:spec.color, emissive:spec.color, emissiveIntensity:0.22,
    roughness:0.4, transparent:true, opacity:0.34 });
  for (let i = 0; i < 5; i++){
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.004,1.5,5), tmat);
    const a = (i/5)*Math.PI*2;
    t.position.set(Math.cos(a)*0.20, -0.75, Math.sin(a)*0.20);
    g.add(t); tent.push({ mesh:t, a });
  }
  return { group:g, bell, tent };
}

function buildJellies(){
  SPECIMENS.forEach((s, i) => {
    const j = makeJelly(s);
    const x = (i - (SPECIMENS.length-1)/2) * 2.15 + (Math.random()-.5)*0.5;
    j.group.position.set(x, 1.5 + Math.random()*1.4, -2.2 - Math.random()*2.4);
    scene.add(j.group);
    jellies.push({
      data:s, ...j,
      phase:Math.random()*6.28, drift:0.16 + Math.random()*0.1,
      home:j.group.position.clone(),
      glow:new K.Spring(0,110,18),
      el:btns[i].parentElement, btn:btns[i]
    });
  });
}

/* a small school, purely for movement in the mid-ground */
function buildSchool(){
  const mat = new THREE.MeshStandardMaterial({ color:0x7FC9C0, roughness:0.6,
    emissive:0x2E6E6A, emissiveIntensity:0.3 });
  for (let i = 0; i < 18; i++){
    const m = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.24, 6), mat);
    m.rotation.z = Math.PI/2;
    scene.add(m);
    fish.push({ mesh:m, phase:Math.random()*6.28, r:2.2+Math.random()*2.6,
      y:1.0+Math.random()*2.4, z:-4-Math.random()*4, speed:0.22+Math.random()*0.16 });
  }
}

function buildBubbles(){
  const N = 130, pos = new Float32Array(N*3);
  for (let i = 0; i < N; i++){
    pos[i*3]   = (Math.random()-.5)*14;
    pos[i*3+1] = Math.random()*6;
    pos[i*3+2] = -1 - Math.random()*9;
  }
  bubbleGeo = new THREE.BufferGeometry();
  bubbleGeo.setAttribute("position", new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(bubbleGeo, new THREE.PointsMaterial({
    color:0xBFF7F0, size:0.035, sizeAttenuation:true, transparent:true,
    opacity:0.34, depthWrite:false, blending:THREE.AdditiveBlending })));
}

let camBase = new THREE.Vector3(), camLook = new THREE.Vector3();
const look = { x:0, y:0, tx:0, ty:0 };

function layout(){
  renderer.setSize(innerWidth, innerHeight, false);
  const aspect = innerWidth/Math.max(1,innerHeight);
  camera.aspect = aspect; camera.updateProjectionMatrix();
  const d = 5.2 * Math.min(1.7, Math.max(1, 1.12/aspect));
  camBase.set(0, 2.0, d);
  camLook.set(0, 1.75, -2);
  camera.position.copy(camBase); camera.lookAt(camLook);
}

function setCaption(i){
  focusIdx = i;
  const s = SPECIMENS[i];
  caption.innerHTML = "";
  const a = document.createElement("span");
  a.textContent = s.name;
  a.style.color = "#" + s.color.toString(16).padStart(6,"0");
  const b = document.createElement("span");
  b.textContent = "  ·  " + s.latin;
  b.style.color = "var(--muted)";
  caption.append(a,b);
}
function showPlate(i){
  const s = SPECIMENS[i];
  plate.innerHTML = "";
  const n = document.createElement("p"); n.className="p-name"; n.textContent = s.name;
  const l = document.createElement("p"); l.className="p-latin"; l.textContent = s.latin;
  const o = document.createElement("p"); o.className="p-note"; o.textContent = s.note;
  plate.append(n,l,o);
  plate.classList.add("show");
}

let elapsed = 0, cauAcc = 0;

function tick(){
  const dt = Math.min(0.05, clock.getDelta());
  elapsed += dt;
  const R = K.reduced;

  if (!R){
    cauAcc += dt;
    if (cauAcc >= 1/12){ cauAcc = 0; paintCaustic(causticCtx, elapsed); }
  }

  jellies.forEach((j, i) => {
    const g = j.glow.step(dt);
    if (!R){
      const t = elapsed * j.drift + j.phase;
      j.group.position.set(
        j.home.x + Math.sin(t*0.7)*0.55,
        j.home.y + Math.sin(t*1.15)*0.42,
        j.home.z + Math.cos(t*0.55)*0.5
      );
      /* the bell pulses, and the tentacles lag behind it */
      const pulse = 1 + Math.sin(t*2.6)*0.11;
      j.bell.scale.set(pulse, 2 - pulse, pulse);
      j.tent.forEach((tn, k) => {
        tn.mesh.rotation.z = Math.sin(t*2.6 - 0.6 + k)*0.20;
        tn.mesh.rotation.x = Math.cos(t*2.3 - 0.4 + k)*0.16;
      });
    }
    j.bell.material.emissiveIntensity = 0.32 + g*0.85;
    j.bell.material.opacity = 0.55 + g*0.25;
  });

  if (!R){
    kelps.forEach(kl => {
      const p = kl.mesh.geometry.attributes.position;
      const arr = p.array, base = kl.base;
      for (let i = 0; i < arr.length; i += 3){
        const yFrac = (base[i+1] + kl.h/2) / kl.h;      // 0 at root, 1 at tip
        arr[i] = base[i] + Math.sin(elapsed*0.8 + kl.phase + yFrac*2.4) * 0.34 * yFrac * yFrac;
        arr[i+2] = base[i+2] + Math.cos(elapsed*0.6 + kl.phase + yFrac*1.9) * 0.20 * yFrac * yFrac;
      }
      p.needsUpdate = true;
    });

    fish.forEach(f => {
      const a = elapsed*f.speed + f.phase;
      f.mesh.position.set(Math.cos(a)*f.r, f.y + Math.sin(a*2.1)*0.22, f.z + Math.sin(a)*f.r*0.55);
      f.mesh.rotation.y = -a + Math.PI/2;
    });

    const bp = bubbleGeo.attributes.position.array;
    for (let i = 0; i < bp.length; i += 3){
      bp[i+1] += dt * (0.30 + (i % 5) * 0.05);
      bp[i]   += Math.sin(elapsed*0.7 + i) * dt * 0.06;
      if (bp[i+1] > 6.2) bp[i+1] = 0.05;
    }
    bubbleGeo.attributes.position.needsUpdate = true;

    godrays.forEach(gr => {
      gr.mesh.position.x = gr.baseX + Math.sin(elapsed*0.22 + gr.phase)*0.5;
      gr.mesh.material.opacity = 0.10 + (Math.sin(elapsed*0.5 + gr.phase)*0.5+0.5)*0.09;
    });

    look.x += (look.tx-look.x)*(1-Math.exp(-1.9*dt));
    look.y += (look.ty-look.y)*(1-Math.exp(-1.9*dt));
    camera.position.set(camBase.x + look.x*0.75, camBase.y + look.y*0.34, camBase.z);
    camera.lookAt(camLook.x + look.x*0.30, camLook.y + look.y*0.14, camLook.z);
  }

  projector.frame();
  jellies.forEach(j => {
    const r = projector.place(j.group, j.el, { half:0.45, scale:1.5, minHalf:26 });
    j.btn.tabIndex = r.behind ? -1 : 0;
    j.btn.style.display = r.behind ? "none" : "";
  });

  renderer.render(scene, camera);
}

btns.forEach((b,i) => {
  const on = () => { jellies[i].glow.t = 1; setCaption(i); showPlate(i); };
  const off = () => { jellies[i].glow.t = 0; plate.classList.remove("show"); };
  b.addEventListener("mouseenter", on);
  b.addEventListener("mouseleave", off);
  b.addEventListener("focus", on);
  b.addEventListener("blur", off);
  b.addEventListener("click", on);
});

addEventListener("pointermove", e => {
  look.tx = (e.clientX/innerWidth - 0.5)*2;
  look.ty = (e.clientY/innerHeight - 0.5)*2;
}, { passive:true });

addEventListener("keydown", e => {
  if (e.key === "ArrowRight"){ e.preventDefault(); btns[(focusIdx+1)%SPECIMENS.length].focus(); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); btns[(focusIdx-1+SPECIMENS.length)%SPECIMENS.length].focus(); }
  if (e.key === "Escape") plate.classList.remove("show");
});

K.boot(init, () => K.fallback(btns));
</script>
</body>
</html>
