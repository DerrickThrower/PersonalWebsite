<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Thrower Arcade — Derrick Thrower</title>
<meta name="description" content="A dark arcade room. Five cabinets running attract mode, lit only by their own screens." />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
:root{
  --bg:#07070A;
  --ink:#EDEDE8;
  --muted:#7C7C86;
  --accent:#C8A24B;
  --display:"Space Grotesk", Arial, sans-serif;
  --mono:"Space Mono", ui-monospace, Menlo, monospace;
  --pad: clamp(16px, 3.2vw, 34px);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--mono); overflow:hidden; overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
body.fallback{ overflow:auto; }
.sr{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;
}

#stage{ position:fixed; inset:0; }
body.fallback #stage{ display:none; }
#gl{ display:block; width:100%; height:100%; touch-action:none; }

/* --- the CRT overlays: scanlines, bloom haze, vignette --- */
#scanlines{
  position:fixed; inset:0; z-index:3; pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
    rgba(0,0,0,.24) 3px, rgba(0,0,0,.24) 4px);
  mix-blend-mode:multiply; opacity:.55;
}
#vignette{
  position:fixed; inset:0; z-index:4; pointer-events:none;
  background:radial-gradient(115% 85% at 50% 45%,
    rgba(0,0,0,0) 38%, rgba(0,0,0,.55) 76%, rgba(0,0,0,.92) 100%);
}
#flicker{
  position:fixed; inset:0; z-index:5; pointer-events:none;
  background:rgba(120,150,255,.05); opacity:0;
}
#curtain{
  position:fixed; inset:0; z-index:60; background:#000;
  pointer-events:none; opacity:1; transition:opacity 800ms ease 100ms;
}
body.lit #curtain{ opacity:0; }
body.leaving #curtain{ opacity:1; transition:opacity 420ms ease; }

/* --- chrome --- */
#topbar{
  position:fixed; z-index:20; inset:0 0 auto 0; padding:var(--pad);
  padding-top:max(var(--pad), env(safe-area-inset-top));
  display:flex; justify-content:space-between; align-items:baseline; gap:1rem;
  pointer-events:none;
}
#topbar > *{ pointer-events:auto; }
.mark{
  font-family:var(--display); font-weight:700; font-size:clamp(15px,2.1vw,20px);
  letter-spacing:.13em; text-transform:uppercase; margin:0;
}
.backlink{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); text-decoration:none; border:1px solid transparent;
  padding:.5em .8em; border-radius:2px; transition:color 160ms, border-color 160ms;
}
.backlink:hover{ color:var(--ink); border-color:rgba(200,162,75,.4); }
.backlink:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

#footline{
  position:fixed; z-index:20; inset:auto 0 0 0;
  bottom:max(var(--pad), env(safe-area-inset-bottom));
  padding:0 var(--pad); text-align:center; pointer-events:none;
}
#caption{
  font-family:var(--mono); font-size:clamp(11px,1.5vw,13px);
  letter-spacing:.18em; text-transform:uppercase; margin:0 0 .5rem;
  transition:color 300ms ease;
}
#hint{ font-family:var(--mono); font-size:11px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--muted); margin:0; }

/* --- cabinet hit targets / accessible list --- */
#cab-list{
  position:fixed; inset:0; z-index:10; margin:0; padding:0; list-style:none;
  pointer-events:none;
}
#cab-list li{ position:absolute; left:0; top:0; }
.cab-btn{
  display:block; width:100%; height:100%; padding:0; margin:0;
  background:none; border:1px solid transparent; border-radius:3px;
  cursor:pointer; pointer-events:auto; color:inherit; font:inherit;
  transition:border-color 150ms;
}
.cab-btn:hover{ border-color:rgba(200,162,75,.3); }
.cab-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

/* --- fallback --- */
#fallback-note{ display:none; }
body.fallback #scanlines,
body.fallback #vignette,
body.fallback #flicker,
body.fallback #curtain,
body.fallback #footline{ display:none; }
body.fallback #topbar{ position:static; }
body.fallback #fallback-note{
  display:block; max-width:56rem; margin:0 auto; padding:1.5rem var(--pad) 0;
  font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
}
body.fallback #cab-list{
  position:static; display:grid; gap:.6rem; max-width:56rem;
  margin:1rem auto 4rem; padding:0 var(--pad); pointer-events:auto;
}
body.fallback #cab-list li{ position:static; }
body.fallback .cab-btn{
  height:auto; text-align:left; cursor:default;
  border:1px solid rgba(255,255,255,.08); padding:1.3rem 1.4rem;
  background:linear-gradient(170deg,#111014,#0B0B0E);
}
body.fallback .sr{
  position:static; width:auto; height:auto; margin:0; overflow:visible;
  clip:auto; clip-path:none; white-space:normal;
}
body.fallback .cab-name{
  display:block; font-family:var(--display); font-weight:700; font-size:1.25rem;
}
body.fallback .cab-desc{ display:block; color:var(--muted); margin-top:.4rem; font-size:.9rem; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important; transition-duration:.001ms !important;
  }
  #scanlines{ opacity:.35; }
}
</style>
</head>
<body>

<header id="topbar">
  <h1 class="mark">Thrower Arcade</h1>
  <nav id="roomnav" aria-label="Rooms"></nav>
</header>

<div id="stage" aria-hidden="true"><canvas id="gl"></canvas></div>
<div id="scanlines" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="flicker" aria-hidden="true"></div>
<div id="curtain" aria-hidden="true"></div>

<main>
  <p id="fallback-note">WebGL unavailable — showing the plain text edition.</p>
  <h2 class="sr">Cabinets</h2>
  <ul id="cab-list"><!-- built from CABINETS --></ul>
</main>

<div id="footline">
  <p id="caption"></p>
  <p id="hint">drag to look &middot; hover a cabinet</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/room-nav.js"></script>
<script>
/* =====================================================================
   THROWER ARCADE
   A dark room lit only by the cabinets. Every screen is a <canvas>
   running its own attract loop, used as an emissive texture and as the
   actual light source for the room.
   ===================================================================== */

/* Each cabinet: a name, a phosphor colour, and an attract-mode routine.
   `draw(ctx, w, h, t, S)` is called ~15x a second — t is seconds elapsed,
   S is a scratch object that persists between frames for game state. */
const CABINETS = [
  {
    name: "PONG",
    year: "1972",
    desc: "Two paddles and a ball. Where all of this started.",
    color: 0xE8F4FF,
    draw(ctx, w, h, t, S){
      if (S.by === undefined){ S.bx = w/2; S.by = h/2; S.vx = w*0.42; S.vy = h*0.30; }
      const dt = 1/15;
      S.bx += S.vx*dt; S.by += S.vy*dt;
      if (S.bx < 16 || S.bx > w-16) S.vx *= -1;
      if (S.by < 10 || S.by > h-10) S.vy *= -1;
      /* paddles chase the ball, imperfectly, so a rally never quite ends */
      S.p1 = (S.p1 ?? h/2) + (S.by - (S.p1 ?? h/2)) * 0.16;
      S.p2 = (S.p2 ?? h/2) + (S.by - (S.p2 ?? h/2)) * 0.11;

      ctx.fillStyle = "#05060A"; ctx.fillRect(0,0,w,h);
      ctx.setLineDash([h*0.045, h*0.045]);
      ctx.strokeStyle = "rgba(232,244,255,.32)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#E8F4FF";
      ctx.fillRect(14, S.p1 - h*0.11, 9, h*0.22);
      ctx.fillRect(w-23, S.p2 - h*0.11, 9, h*0.22);
      ctx.fillRect(S.bx-7, S.by-7, 14, 14);
      ctx.font = '700 ' + Math.round(h*0.16) + 'px "Space Mono", monospace';
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(232,244,255,.5)";
      ctx.fillText("07", w*0.32, h*0.20); ctx.fillText("11", w*0.68, h*0.20);
    }
  },
  {
    name: "SNAKE",
    year: "1976",
    desc: "It gets longer. That is the whole problem.",
    color: 0x6BFF9E,
    draw(ctx, w, h, t, S){
      const C = 16, cw = w/C, ch = h/C;
      if (!S.body){ S.body = [{x:8,y:8}]; S.dir = {x:1,y:0}; S.food = {x:3,y:5}; S.len = 6; }
      if (Math.random() < 0.30){
        const opts = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]
          .filter(d => d.x !== -S.dir.x || d.y !== -S.dir.y);
        const head = S.body[S.body.length-1];
        opts.sort((a,b) =>
          (Math.abs(head.x+a.x-S.food.x)+Math.abs(head.y+a.y-S.food.y)) -
          (Math.abs(head.x+b.x-S.food.x)+Math.abs(head.y+b.y-S.food.y)));
        S.dir = opts[0];
      }
      const head = S.body[S.body.length-1];
      const nx = (head.x + S.dir.x + C) % C, ny = (head.y + S.dir.y + C) % C;
      S.body.push({x:nx, y:ny});
      if (nx === S.food.x && ny === S.food.y){
        S.len = Math.min(S.len + 2, 40);
        S.food = { x:(Math.random()*C)|0, y:(Math.random()*C)|0 };
      }
      while (S.body.length > S.len) S.body.shift();

      ctx.fillStyle = "#040A06"; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = "rgba(107,255,158,.07)"; ctx.lineWidth = 1;
      for (let i=1;i<C;i++){
        ctx.beginPath(); ctx.moveTo(i*cw,0); ctx.lineTo(i*cw,h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,i*ch); ctx.lineTo(w,i*ch); ctx.stroke();
      }
      ctx.fillStyle = "#FF5C7A";
      ctx.fillRect(S.food.x*cw+3, S.food.y*ch+3, cw-6, ch-6);
      S.body.forEach((s,i) => {
        ctx.fillStyle = "rgba(107,255,158," + (0.35 + 0.65*i/S.body.length).toFixed(2) + ")";
        ctx.fillRect(s.x*cw+2, s.y*ch+2, cw-4, ch-4);
      });
    }
  },
  {
    name: "BREAKOUT",
    year: "1976",
    desc: "Bricks, one ball, and no forgiveness.",
    color: 0xFFB347,
    draw(ctx, w, h, t, S){
      const COLS = 9, ROWS = 5, bw = w/COLS, bh = h*0.052;
      if (!S.bricks){ S.bricks = []; for(let i=0;i<COLS*ROWS;i++) S.bricks.push(1);
        S.bx=w/2; S.by=h*0.66; S.vx=w*0.40; S.vy=-h*0.42; }
      const dt = 1/15;
      S.bx += S.vx*dt; S.by += S.vy*dt;
      if (S.bx<8||S.bx>w-8) S.vx*=-1;
      if (S.by<8) S.vy*=Math.sign(S.vy)===-1?-1:1, S.vy=Math.abs(S.vy);
      if (S.by>h-26){ S.vy = -Math.abs(S.vy); }
      S.pad = (S.pad ?? w/2) + (S.bx - (S.pad ?? w/2))*0.22;
      const col = Math.floor(S.bx/bw), row = Math.floor((S.by - h*0.10)/bh);
      if (row>=0 && row<ROWS && col>=0 && col<COLS){
        const k = row*COLS+col;
        if (S.bricks[k]){ S.bricks[k]=0; S.vy*=-1; }
      }
      if (S.bricks.every(b=>!b)) S.bricks = S.bricks.map(()=>1);

      ctx.fillStyle = "#0A0703"; ctx.fillRect(0,0,w,h);
      const hues = ["#FF6B4A","#FFB347","#FFE66D","#8CE99A","#74C0FC"];
      for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
        if (!S.bricks[r*COLS+c]) continue;
        ctx.fillStyle = hues[r];
        ctx.fillRect(c*bw+2, h*0.10+r*bh+2, bw-4, bh-4);
      }
      ctx.fillStyle = "#FFF3D6";
      ctx.fillRect(S.pad-w*0.09, h-20, w*0.18, 9);
      ctx.beginPath(); ctx.arc(S.bx, S.by, 7, 0, Math.PI*2); ctx.fill();
    }
  },
  {
    name: "INVADERS",
    year: "1978",
    desc: "They only ever move in one direction: closer.",
    color: 0x9BFF6B,
    draw(ctx, w, h, t, S){
      const COLS = 7, ROWS = 4;
      S.step = (S.step ?? 0) + 1;
      const sway = Math.sin(S.step*0.14) * w*0.10;
      const drop = ((S.step*0.55) % (h*0.42));
      ctx.fillStyle = "#040A04"; ctx.fillRect(0,0,w,h);

      const cw2 = w/(COLS+2), rh = h*0.085;
      for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
        const x = cw2*(c+1.5) + sway, y = h*0.13 + r*rh + drop;
        ctx.fillStyle = ["#9BFF6B","#6BFFD5","#FFE66D","#FF8CC8"][r];
        const s = cw2*0.30, blink = (S.step + c + r) % 2 === 0 ? 1 : 0;
        ctx.fillRect(x-s, y-s*0.6, s*2, s*1.2);
        ctx.fillRect(x-s*1.4, y-s*0.1, s*0.4, s*0.7);
        ctx.fillRect(x+s, y-s*0.1, s*0.4, s*0.7);
        if (blink){ ctx.fillRect(x-s*0.6, y+s*0.6, s*0.4, s*0.4);
                    ctx.fillRect(x+s*0.2, y+s*0.6, s*0.4, s*0.4); }
      }
      ctx.fillStyle = "#E9FFE4";
      const px = w/2 + Math.sin(S.step*0.09)*w*0.30;
      ctx.fillRect(px-14, h-24, 28, 8); ctx.fillRect(px-4, h-32, 8, 8);
      if (S.step % 6 < 3){ ctx.fillRect(px-2, h-56, 4, 16); }
    }
  },
  {
    name: "STARFIELD",
    year: "1979",
    desc: "Vector graphics, no gravity, nowhere to be.",
    color: 0x8AB6FF,
    draw(ctx, w, h, t, S){
      if (!S.stars){
        S.stars = Array.from({length:90}, () => ({
          x:(Math.random()-.5)*2, y:(Math.random()-.5)*2, z:Math.random()
        }));
      }
      ctx.fillStyle = "#03050C"; ctx.fillRect(0,0,w,h);
      for (const s of S.stars){
        s.z -= 0.012;
        if (s.z <= 0.02){ s.z = 1; s.x = (Math.random()-.5)*2; s.y = (Math.random()-.5)*2; }
        const k = 0.5/s.z;
        const x = w/2 + s.x*k*w*0.5, y = h/2 + s.y*k*h*0.5;
        const r = Math.max(0.6, (1-s.z)*3.2);
        ctx.fillStyle = "rgba(200,220,255," + (1-s.z).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      }
      /* wireframe ship, slowly tumbling */
      const a = t*0.6, cx = w/2, cy = h*0.62, sc = h*0.11;
      const pts = [[0,-1.5],[1,1],[0,0.45],[-1,1]].map(([px,py]) => [
        cx + (px*Math.cos(a) - py*Math.sin(a))*sc,
        cy + (px*Math.sin(a) + py*Math.cos(a))*sc
      ]);
      ctx.strokeStyle = "#8AB6FF"; ctx.lineWidth = 2.5; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
      for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.closePath(); ctx.stroke();
    }
  }
];

/* ------------------------- accessible DOM ------------------------- */
const listEl = document.getElementById("cab-list");
const cabBtns = [];
CABINETS.forEach((cab, i) => {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.className = "cab-btn"; b.type = "button"; b.dataset.i = String(i);
  const sr = document.createElement("span");
  sr.className = "sr";
  sr.innerHTML = '<span class="cab-name"></span><span class="cab-desc"></span>';
  sr.querySelector(".cab-name").textContent = cab.name + " (" + cab.year + ")";
  sr.querySelector(".cab-desc").textContent = cab.desc;
  b.appendChild(sr); li.appendChild(b); listEl.appendChild(li);
  cabBtns.push(b);
});

/* ------------------------- setup ------------------------- */
const mqReduce = window.matchMedia("(prefers-reduced-motion: reduce)");
let REDUCE = mqReduce.matches;
mqReduce.addEventListener?.("change", e => { REDUCE = e.matches; });

function webglOK(){
  try {
    const c = document.createElement("canvas");
    return !!(window.WebGLRenderingContext &&
      (c.getContext("webgl") || c.getContext("experimental-webgl")));
  } catch(_) { return false; }
}
function goFallback(){
  document.body.classList.add("fallback");
  const s = document.getElementById("stage"); if (s) s.remove();
  cabBtns.forEach(b => { b.disabled = true; b.removeAttribute("style");
                         b.parentElement.removeAttribute("style"); });
}

let renderer, scene, camera, clock, cabs = [], hazeGeo, haze;
const SCREEN_W = 512, SCREEN_H = 384;
const caption = document.getElementById("caption");
const flickerEl = document.getElementById("flicker");
let focusIdx = 0;

function linearize(){
  scene.traverse(o => {
    if (o.isLight && o.color) o.color.convertSRGBToLinear();
    if (!o.isMesh && !o.isPoints) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats){
      if (m && m.color && !m.userData._lin){ m.color.convertSRGBToLinear(); m.userData._lin = true; }
      if (m && m.emissive && !m.userData._elin){ m.emissive.convertSRGBToLinear(); m.userData._elin = true; }
    }
  });
}

function init(){
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07070A);
  scene.fog = new THREE.Fog(0x07070A, 7, 20);
  camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 60);
  clock = new THREE.Clock();

  scene.add(new THREE.AmbientLight(0x1A1E2E, 0.5));

  buildRoom();
  buildCabinets();
  buildHaze();
  linearize();
  layout();
  addEventListener("resize", layout, { passive:true });

  document.body.classList.add("lit");
  setCaption(0);
  renderer.setAnimationLoop(tick);
}

function buildRoom(){
  /* floor is semi-transparent over mirrored cabinets — a cheap wet-floor
     reflection that costs one extra draw of geometry we already have */
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshStandardMaterial({
      color: 0x0A0A0F, roughness: 0.35, metalness: 0.5,
      transparent: true, opacity: 0.80
    })
  );
  floor.rotation.x = -Math.PI/2;
  floor.renderOrder = 2;
  scene.add(floor);

  /* back wall and ceiling, just far enough to catch a little screen light */
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x0C0C12, roughness: 0.95 });
  const back = new THREE.Mesh(new THREE.PlaneGeometry(30, 8), wallMat);
  back.position.set(0, 4, -4.6);
  scene.add(back);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(30, 14), wallMat);
  ceil.rotation.x = Math.PI/2; ceil.position.y = 4.4;
  scene.add(ceil);
}

/* one cabinet: body, marquee, bezel, screen, control panel, coin door */
function makeCabinet(cab, i, mirrored){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x14141A, roughness: 0.72, metalness: 0.15 });
  const sideMat = new THREE.MeshStandardMaterial({ color: 0x101017, roughness: 0.8 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(0.92, 1.72, 0.74), sideMat);
  body.position.y = 0.86; g.add(body);

  /* marquee: a lit sign at the top, in the cabinet's own colour */
  const marqueeCanvas = document.createElement("canvas");
  marqueeCanvas.width = 512; marqueeCanvas.height = 128;
  const mc = marqueeCanvas.getContext("2d");
  mc.fillStyle = "#0A0A10"; mc.fillRect(0,0,512,128);
  mc.font = '700 62px "Space Grotesk", sans-serif';
  mc.textAlign = "center"; mc.textBaseline = "middle";
  mc.fillStyle = "#" + cab.color.toString(16).padStart(6,"0");
  mc.fillText(cab.name, 256, 66);
  mc.strokeStyle = "rgba(255,255,255,.18)"; mc.lineWidth = 4;
  mc.strokeRect(8, 8, 496, 112);
  const mTex = new THREE.CanvasTexture(marqueeCanvas);
  mTex.encoding = THREE.sRGBEncoding;
  const marquee = new THREE.Mesh(
    new THREE.BoxGeometry(0.86, 0.26, 0.10),
    [bodyMat, bodyMat, bodyMat, bodyMat,
     new THREE.MeshStandardMaterial({ map: mTex, emissive: cab.color, emissiveMap: mTex, emissiveIntensity: 0.8 }),
     bodyMat]
  );
  marquee.position.set(0, 1.60, 0.35); g.add(marquee);

  /* the screen — a live canvas, tilted back like a real bezel */
  const sc = document.createElement("canvas");
  sc.width = SCREEN_W; sc.height = SCREEN_H;
  const sctx = sc.getContext("2d");
  sctx.fillStyle = "#05060A"; sctx.fillRect(0,0,SCREEN_W,SCREEN_H);
  const sTex = new THREE.CanvasTexture(sc);
  sTex.encoding = THREE.sRGBEncoding;
  /* unlit on purpose: a CRT emits, it doesn't reflect. A lit material would
     also catch this cabinet's own point light as a hotspot on the glass. */
  const screenMat = new THREE.MeshBasicMaterial({ map: sTex });
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.55), screenMat);
  /* must sit proud of the bezel box, whose front face is at 0.38 — otherwise
     the surround swallows the screen entirely */
  screen.position.set(0, 1.18, 0.393);
  screen.rotation.x = -0.16;
  g.add(screen);

  /* bezel around the screen */
  const bezel = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.66, 0.06), bodyMat);
  bezel.position.set(0, 1.18, 0.35); bezel.rotation.x = -0.16;
  g.add(bezel);

  /* additive glow plane in front of the screen — stands in for bloom,
     which r128's core build has no post-processing for */
  const glowCanvas = document.createElement("canvas");
  glowCanvas.width = glowCanvas.height = 128;
  const gc = glowCanvas.getContext("2d");
  /* hollow in the middle: the screen has to read through it, so this is spill
     around the glass, not a wash across it */
  const rg = gc.createRadialGradient(64,64,4,64,64,62);
  /* the clear centre has to reach past the screen's edge, which sits at
     ~0.55 of this plane's radius — otherwise the halo washes the picture */
  rg.addColorStop(0,   "rgba(255,255,255,0)");
  rg.addColorStop(.55, "rgba(255,255,255,0)");
  rg.addColorStop(.63, "rgba(255,255,255,.40)");
  rg.addColorStop(.82, "rgba(255,255,255,.11)");
  rg.addColorStop(1,   "rgba(255,255,255,0)");
  gc.fillStyle = rg; gc.fillRect(0,0,128,128);
  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(1.30, 1.10),
    new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(glowCanvas), color: cab.color,
      transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  glow.position.set(0, 1.18, 0.44);
  g.add(glow);

  /* control panel and coin door */
  const panel = new THREE.Mesh(new THREE.BoxGeometry(0.90, 0.30, 0.34), bodyMat);
  panel.position.set(0, 0.82, 0.44); panel.rotation.x = 0.42;
  g.add(panel);
  const stick = new THREE.Mesh(
    new THREE.CylinderGeometry(0.018, 0.022, 0.11, 10),
    new THREE.MeshStandardMaterial({ color: 0x2A2A34, roughness: 0.5 })
  );
  stick.position.set(-0.20, 0.94, 0.47); g.add(stick);
  const ball = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.035, 0.035, 12),
    new THREE.MeshStandardMaterial({ color: 0xC03040, roughness: 0.35 })
  );
  ball.position.set(-0.20, 1.00, 0.47); g.add(ball);
  for (let b = 0; b < 3; b++){
    const btn = new THREE.Mesh(
      new THREE.CylinderGeometry(0.026, 0.026, 0.02, 12),
      new THREE.MeshStandardMaterial({ color: b===1?0xE0B23A:0xD03A4A, roughness: 0.4 })
    );
    btn.position.set(0.06 + b*0.10, 0.955, 0.47); g.add(btn);
  }
  const coin = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.24, 0.04), sideMat);
  coin.position.set(0, 0.36, 0.375); g.add(coin);

  if (mirrored){
    /* the reflection: flipped, dimmed, and never lit or interactive */
    g.scale.y = -1;
    g.traverse(o => {
      if (!o.isMesh) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      o.material = mats.map(m => {
        const c = m.clone();
        c.transparent = true; c.opacity = 0.22; c.depthWrite = false;
        return c;
      });
      if (o.material.length === 1) o.material = o.material[0];
    });
  }
  return { group: g, screen, sctx, sTex, glow, screenMat, marquee };
}

function buildCabinets(){
  const n = CABINETS.length;
  CABINETS.forEach((cab, i) => {
    /* a gentle arc so the outer cabinets angle in toward the camera */
    const t = (i - (n-1)/2);
    const x = t * 1.28;
    const z = -Math.abs(t) * 0.30;
    const ry = -t * 0.13;

    const real = makeCabinet(cab, i, false);
    real.group.position.set(x, 0, z);
    real.group.rotation.y = ry;
    scene.add(real.group);

    const refl = makeCabinet(cab, i, true);
    refl.group.position.set(x, 0, z);
    refl.group.rotation.y = ry;
    scene.add(refl.group);

    /* the screen is the room's actual light source */
    const light = new THREE.PointLight(cab.color, 1.5, 6.5, 2);
    light.position.set(x, 1.25, z + 0.75);
    scene.add(light);

    cabs.push({
      data: cab, ...real, reflection: refl, light,
      state: {}, baseIntensity: 1.5,
      el: cabBtns[i].parentElement, btn: cabBtns[i], hover: 0
    });
  });
}

function buildHaze(){
  /* slow drifting motes, so the cone of light from each screen has something
     to catch — the arcade equivalent of the shop's dust */
  const N = 220;
  const pos = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    pos[i*3]   = (Math.random()-.5)*9;
    pos[i*3+1] = Math.random()*3.2;
    pos[i*3+2] = (Math.random()-.5)*5 + 0.5;
  }
  hazeGeo = new THREE.BufferGeometry();
  hazeGeo.setAttribute("position", new THREE.BufferAttribute(pos,3));
  haze = new THREE.Points(hazeGeo, new THREE.PointsMaterial({
    color: 0x9FB6FF, size: 0.018, sizeAttenuation: true,
    transparent: true, opacity: 0.20, depthWrite: false,
    blending: THREE.AdditiveBlending
  }));
  scene.add(haze);
}

let camBase = new THREE.Vector3(), camLook = new THREE.Vector3();
const look = { x:0, y:0, tx:0, ty:0 };

function layout(){
  renderer.setSize(innerWidth, innerHeight, false);
  const aspect = innerWidth / Math.max(1, innerHeight);
  camera.aspect = aspect; camera.updateProjectionMatrix();

  const dist = 4.6 * Math.min(1.7, Math.max(1, 1.15/aspect));
  camBase.set(0, 1.62, dist);
  camLook.set(0, 1.16, 0);
  camera.position.copy(camBase);
  camera.lookAt(camLook);
  scene.fog.near = dist * 0.9;
  scene.fog.far  = dist * 4.0;
}

function setCaption(i){
  focusIdx = i;
  const c = CABINETS[i];
  caption.innerHTML = "";
  const a = document.createElement("span");
  a.textContent = c.name + " · " + c.year;
  a.style.color = "#" + c.color.toString(16).padStart(6,"0");
  const b = document.createElement("span");
  b.textContent = "  " + c.desc;
  b.style.color = "var(--muted)";
  caption.append(a, b);
}

/* -------------------- loop -------------------- */
let elapsed = 0, screenAcc = 0;
const projV = new THREE.Vector3(), projU = new THREE.Vector3(), camUp = new THREE.Vector3();

function tick(){
  const dt = Math.min(0.05, clock.getDelta());
  elapsed += dt;

  /* attract loops repaint at ~15fps — they're 1970s games, and it keeps
     five canvas uploads per frame from becoming the bottleneck */
  screenAcc += dt;
  if (screenAcc >= 1/15){
    screenAcc = 0;
    for (const c of cabs){
      if (REDUCE && c.painted) continue;
      c.data.draw(c.sctx, SCREEN_W, SCREEN_H, elapsed, c.state);
      c.sTex.needsUpdate = true;
      c.painted = true;
    }
  }

  for (const c of cabs){
    /* CRT flicker: a small unsteady wobble on the emissive and the light */
    const f = REDUCE ? 1 :
      1 + Math.sin(elapsed*37 + c.light.position.x*9)*0.03 +
          (Math.random()-0.5)*0.05;
    const hoverTarget = c.hover;
    c.screenMat.color.setScalar((0.92 + hoverTarget*0.30) * f);
    c.light.intensity = c.baseIntensity * (1 + hoverTarget*0.7) * f;
    c.glow.material.opacity = (0.52 + hoverTarget*0.30) * f;
  }

  if (!REDUCE){
    const p = hazeGeo.attributes.position.array;
    for (let i=0;i<p.length;i+=3){
      p[i+1] += dt*0.045;
      p[i]   += Math.sin(elapsed*0.3 + i)*dt*0.02;
      if (p[i+1] > 3.4) p[i+1] = 0.05;
    }
    hazeGeo.attributes.position.needsUpdate = true;

    look.x += (look.tx - look.x) * (1 - Math.exp(-2.4*dt));
    look.y += (look.ty - look.y) * (1 - Math.exp(-2.4*dt));
    camera.position.set(camBase.x + look.x*0.55, camBase.y + look.y*0.26, camBase.z);
    camera.lookAt(camLook.x + look.x*0.18, camLook.y + look.y*0.10, camLook.z);

    /* the room's own mains hum: an occasional whole-scene flicker */
    if (Math.random() < 0.004){
      flickerEl.style.opacity = String(0.25 + Math.random()*0.4);
      setTimeout(() => { flickerEl.style.opacity = "0"; }, 60 + Math.random()*90);
    }
  }

  projectButtons();
  renderer.render(scene, camera);
}

function projectButtons(){
  const W = innerWidth, H = innerHeight;
  camUp.setFromMatrixColumn(camera.matrixWorld, 1).normalize();
  cabs.forEach(c => {
    c.screen.getWorldPosition(projV);
    projU.copy(projV).addScaledVector(camUp, 0.55);
    projV.project(camera); projU.project(camera);
    const behind = projV.z > 1;
    const x = (projV.x*0.5+0.5)*W, y = (-projV.y*0.5+0.5)*H;
    const half = Math.max(24, Math.abs((-projU.y*0.5+0.5)*H - y));
    const wPx = half*1.7, hPx = half*2.6;
    c.el.style.width = wPx + "px";
    c.el.style.height = hPx + "px";
    c.el.style.transform =
      "translate(" + (x-wPx/2).toFixed(1) + "px," + (y-hPx/2).toFixed(1) + "px)";
    c.el.style.zIndex = String(Math.round((1-projV.z)*10000));
    c.btn.tabIndex = behind ? -1 : 0;
    c.btn.style.display = behind ? "none" : "";
  });
}

/* -------------------- interaction -------------------- */
cabBtns.forEach((b, i) => {
  const on = () => { cabs[i].hover = 1; setCaption(i); };
  const off = () => { cabs[i].hover = 0; };
  b.addEventListener("mouseenter", on);
  b.addEventListener("mouseleave", off);
  b.addEventListener("focus", on);
  b.addEventListener("blur", off);
  b.addEventListener("click", () => { cabs[i].hover = cabs[i].hover ? 0 : 1; setCaption(i); });
});

addEventListener("pointermove", e => {
  look.tx = (e.clientX/innerWidth - 0.5) * 2;
  look.ty = (e.clientY/innerHeight - 0.5) * 2;
}, { passive:true });

addEventListener("keydown", e => {
  if (e.key === "ArrowRight"){ e.preventDefault(); cabBtns[(focusIdx+1)%CABINETS.length].focus(); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); cabBtns[(focusIdx-1+CABINETS.length)%CABINETS.length].focus(); }
  if (e.key === "Escape") leave("/");
});

/* fade out before navigating, so the rooms feel connected */
function leave(href){
  document.body.classList.add("leaving");
  setTimeout(() => { location.href = href; }, REDUCE ? 0 : 380);
}


/* -------------------- boot -------------------- */
function boot(){
  if (!window.THREE || !webglOK()){ goFallback(); return; }
  try { init(); }
  catch (err){ console.error("[arcade] init failed:", err); goFallback(); }
}
if (document.fonts && document.fonts.ready){
  let done = false;
  const go = () => { if (!done){ done = true; boot(); } };
  document.fonts.ready.then(go);
  setTimeout(go, 2500);
} else boot();
</script>
</body>
