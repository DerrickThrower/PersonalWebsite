<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Machine Room — Derrick Thrower</title>
<meta name="description" content="How an agent swarm actually runs: planner, workers, tools, memory, critic — one blade each." />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#06080C; --ink:#E6ECF2; --muted:#6E7A8A; --accent:#5FD0E8; --warm:#C8A24B;
  --display:"Space Grotesk",Arial,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  --pad:clamp(16px,3.2vw,34px);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono);
  overflow:hidden; overscroll-behavior:none; -webkit-font-smoothing:antialiased; }
body.fallback{ overflow:auto; }
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }

#stage{ position:fixed; inset:0; }
body.fallback #stage{ display:none; }
#gl{ display:block; width:100%; height:100%; touch-action:none; }

#vignette{ position:fixed; inset:0; z-index:4; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 34%, rgba(0,0,0,.55) 74%, rgba(0,0,0,.94) 100%); }
#scanlines{ position:fixed; inset:0; z-index:3; pointer-events:none; opacity:.30;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 3px 4px);
  mix-blend-mode:multiply; }
#curtain{ position:fixed; inset:0; z-index:60; background:#000; pointer-events:none;
  opacity:1; transition:opacity 800ms ease 100ms; }
body.lit #curtain{ opacity:0; }
body.leaving #curtain{ opacity:1; transition:opacity 400ms ease; }

#topbar{ position:fixed; z-index:20; inset:0 0 auto 0; padding:var(--pad);
  padding-top:max(var(--pad),env(safe-area-inset-top));
  display:flex; justify-content:space-between; align-items:baseline; gap:1rem; pointer-events:none; }
#topbar > *{ pointer-events:auto; }
.mark{ font-family:var(--display); font-weight:700; font-size:clamp(15px,2.1vw,20px);
  letter-spacing:.13em; text-transform:uppercase; margin:0; }
.mark small{ display:block; font-family:var(--mono); font-size:11px; font-weight:400;
  letter-spacing:.11em; color:var(--muted); text-transform:uppercase; margin-top:.35em; }

#footline{ position:fixed; z-index:20; inset:auto 0 0 0;
  bottom:max(var(--pad),env(safe-area-inset-bottom)); padding:0 var(--pad);
  text-align:center; pointer-events:none; }
#caption{ font-family:var(--mono); font-size:clamp(11px,1.5vw,13px); letter-spacing:.18em;
  text-transform:uppercase; margin:0 0 .5rem; }
#hint{ font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); margin:0; }

#blade-list{ position:fixed; inset:0; z-index:10; margin:0; padding:0; list-style:none; pointer-events:none; }
#blade-list li{ position:absolute; left:0; top:0; }
.blade-btn{ display:block; width:100%; height:100%; padding:0; margin:0; background:none;
  border:1px solid transparent; border-radius:3px; cursor:pointer; pointer-events:auto;
  color:inherit; font:inherit; transition:border-color 150ms; }
.blade-btn:hover{ border-color:rgba(95,208,232,.35); }
.blade-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

#note{
  position:fixed; z-index:14; left:0; top:0; transform:translate(-50%,-50%);
  background:linear-gradient(160deg,rgba(10,16,24,.97),rgba(6,10,16,.97));
  border:1px solid rgba(95,208,232,.28); border-radius:2px;
  padding:1.5em 1.7em; max-width:min(30rem,92vw);
  opacity:0; visibility:hidden; pointer-events:none; transition:opacity 220ms ease;
  box-shadow:0 26px 70px rgba(0,0,0,.8);
}
#note.show{ opacity:1; visibility:visible; pointer-events:auto; }
#note .n-head{ font-family:var(--mono); font-size:.72em; letter-spacing:.2em; text-transform:uppercase;
  color:var(--accent); padding-bottom:.7em; border-bottom:1px solid rgba(95,208,232,.25); }
#note h3{ font-family:var(--display); font-weight:700; font-size:1.6em; margin:.7em 0 .5em; }
#note p{ font-family:var(--body); font-size:1.02em; line-height:1.62; color:#C6D2DE; margin:0 0 .9em; }
#note p:last-child{ margin-bottom:0; }
#note .n-io{ display:flex; flex-wrap:wrap; gap:.4em; margin-top:.9em; }
#note .n-io span{ font-family:var(--mono); font-size:.66em; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); border:1px solid rgba(255,255,255,.13); padding:.4em .65em; }

#fallback-note{ display:none; }
body.fallback #vignette, body.fallback #scanlines, body.fallback #curtain,
body.fallback #footline, body.fallback #note{ display:none; }
body.fallback #topbar{ position:static; }
body.fallback #fallback-note{ display:block; max-width:56rem; margin:0 auto;
  padding:1.4rem var(--pad) 0; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); }
body.fallback #blade-list{ position:static; display:grid; gap:.6rem; max-width:56rem;
  margin:1rem auto 4rem; padding:0 var(--pad); pointer-events:auto; }
body.fallback #blade-list li{ position:static; }
body.fallback .blade-btn{ height:auto; text-align:left; cursor:default;
  border:1px solid rgba(255,255,255,.08); padding:1.3rem 1.4rem;
  background:linear-gradient(170deg,#0C1119,#080B10); }
body.fallback .sr{ position:static; width:auto; height:auto; margin:0; overflow:visible;
  clip:auto; clip-path:none; white-space:normal; }
body.fallback .b-name{ display:block; font-family:var(--display); font-weight:700; font-size:1.25rem; }
body.fallback .b-role{ display:block; color:var(--accent); font-size:.8rem; letter-spacing:.14em;
  text-transform:uppercase; margin-top:.3rem; }
body.fallback .b-desc{ display:block; font-family:var(--body); color:#C6D2DE; margin-top:.6rem; font-size:1rem; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body>

<header id="topbar">
  <h1 class="mark">Machine Room<small>How an agent swarm actually runs</small></h1>
  <nav id="roomnav" aria-label="Rooms"></nav>
</header>

<div id="stage" aria-hidden="true"><canvas id="gl"></canvas></div>
<div id="scanlines" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="curtain" aria-hidden="true"></div>

<main>
  <p id="fallback-note">WebGL unavailable — showing the plain text edition.</p>
  <h2 class="sr">Blades</h2>
  <ul id="blade-list"><!-- built from BLADES --></ul>
</main>

<div id="note" aria-hidden="true"></div>

<div id="footline">
  <p id="caption"></p>
  <p id="hint">click a blade to pull it &middot; esc to slide it back</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/room-nav.js"></script>
<script>
/* =====================================================================
   THE MACHINE ROOM
   Five blades, one per stage of an agent swarm. Each blade's screen is a
   live canvas visualising that stage. This is a diagram you can walk
   around, not a claim about deployed infrastructure — the copy stays on
   how these systems work, which is the part worth showing.
   ===================================================================== */

const BLADES = [
  {
    id: "PLN-01", name: "Planner", role: "Decomposition",
    color: 0x8ED2FF,
    desc: "One model reads the goal and breaks it into tasks small enough that a worker can finish one without asking follow-up questions. Most swarm failures are really planning failures — tasks that were too vague to hand off.",
    io: ["in: goal", "out: task graph"],
    draw(ctx,w,h,t,S){
      ctx.fillStyle="#050A12"; ctx.fillRect(0,0,w,h);
      const root={x:w*0.5,y:h*0.16};
      const kids=[0,1,2,3].map(i=>({x:w*(0.14+i*0.24),y:h*0.60}));
      ctx.strokeStyle="rgba(142,210,255,.42)"; ctx.lineWidth=2;
      kids.forEach((k,i)=>{
        const on=(Math.floor(t*1.6)%4)===i;
        ctx.strokeStyle=on?"rgba(142,210,255,.95)":"rgba(142,210,255,.30)";
        ctx.beginPath(); ctx.moveTo(root.x,root.y+12);
        ctx.bezierCurveTo(root.x,h*0.40,k.x,h*0.36,k.x,k.y-12); ctx.stroke();
        ctx.fillStyle=on?"#BFE6FF":"rgba(142,210,255,.45)";
        ctx.fillRect(k.x-16,k.y-10,32,20);
        ctx.fillStyle="rgba(5,10,18,.9)";
        ctx.fillRect(k.x-11,k.y-4,22-((i*5)%9),3);
      });
      ctx.fillStyle="#DDF1FF"; ctx.beginPath();
      ctx.arc(root.x,root.y,13,0,Math.PI*2); ctx.fill();
      ctx.font='700 15px "Space Mono",monospace'; ctx.textAlign="center";
      ctx.fillStyle="rgba(142,210,255,.7)"; ctx.fillText("GOAL",root.x,h*0.055);
    }
  },
  {
    id: "WRK-04", name: "Workers", role: "Parallel execution",
    color: 0x6BFFC2,
    desc: "Independent tasks run at the same time. The wins are real but so are the costs: every worker starts cold, re-derives context the others already had, and burns tokens doing it. Fan out where the work is genuinely independent, not everywhere.",
    io: ["in: task", "out: result"],
    draw(ctx,w,h,t,S){
      ctx.fillStyle="#04120D"; ctx.fillRect(0,0,w,h);
      const N=4, laneH=h/(N+1);
      for(let i=0;i<N;i++){
        const y=laneH*(i+1);
        ctx.strokeStyle="rgba(107,255,194,.16)"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(w*0.10,y); ctx.lineTo(w*0.90,y); ctx.stroke();
        const speed=0.22+i*0.06;
        const p=((t*speed)+i*0.23)%1;
        const x=w*0.10+p*w*0.80;
        ctx.fillStyle="rgba(107,255,194,"+(0.35+0.65*Math.sin(p*Math.PI)).toFixed(2)+")";
        ctx.fillRect(x-14,y-6,28,12);
        ctx.fillStyle="rgba(107,255,194,.55)";
        ctx.fillRect(w*0.075,y-8,5,16);
        ctx.fillStyle=p>0.97?"#BFFFE6":"rgba(107,255,194,.25)";
        ctx.fillRect(w*0.915,y-8,5,16);
      }
    }
  },
  {
    id: "TL-07", name: "Tools", role: "Side effects",
    color: 0xFFC46B,
    desc: "Where an agent stops predicting text and starts touching the world — reading files, hitting APIs, writing to a database. This is the only layer that can do real damage, so it's the one that needs the tightest scoping and the loudest logging.",
    io: ["in: call", "out: observation"],
    draw(ctx,w,h,t,S){
      ctx.fillStyle="#120C04"; ctx.fillRect(0,0,w,h);
      const cx=w*0.28, cy=h*0.5;
      ctx.fillStyle="#FFD9A0"; ctx.beginPath(); ctx.arc(cx,cy,14,0,Math.PI*2); ctx.fill();
      const tools=["fs","http","db","sh"];
      tools.forEach((tn,i)=>{
        const y=h*(0.18+i*0.215), x=w*0.76;
        const phase=(t*0.8+i*0.5)%4;
        const active=phase<1.1;
        ctx.strokeStyle=active?"rgba(255,196,107,.9)":"rgba(255,196,107,.20)";
        ctx.lineWidth=2; ctx.beginPath();
        ctx.moveTo(cx+16,cy); ctx.bezierCurveTo(w*0.5,cy,w*0.5,y,x-22,y); ctx.stroke();
        if(active){
          const q=Math.min(1,phase/1.1);
          const px=cx+16+(x-22-cx-16)*q;
          const py=cy+(y-cy)*(q*q*(3-2*q));
          ctx.fillStyle="#FFF0D6"; ctx.beginPath(); ctx.arc(px,py,4,0,Math.PI*2); ctx.fill();
        }
        ctx.fillStyle=active?"rgba(255,196,107,.95)":"rgba(255,196,107,.30)";
        ctx.fillRect(x-20,y-13,40,26);
        ctx.fillStyle="#120C04"; ctx.font='700 13px "Space Mono",monospace';
        ctx.textAlign="center"; ctx.fillText(tn,x,y+5);
      });
    }
  },
  {
    id: "MEM-02", name: "Memory", role: "Shared context",
    color: 0xB99CFF,
    desc: "What survives between turns, and between agents. Too little and every worker re-derives the same context; too much and the important detail is buried in the noise. The interesting engineering is in what you throw away.",
    io: ["in: writes", "out: retrieval"],
    draw(ctx,w,h,t,S){
      ctx.fillStyle="#0B0714"; ctx.fillRect(0,0,w,h);
      const cols=10, rows=6, cw=w*0.8/cols, ch=h*0.62/rows;
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
        const i=r*cols+c;
        const heat=(Math.sin(t*0.7+i*0.55)+1)/2;
        const recent=heat>0.86;
        ctx.fillStyle=recent?"rgba(220,205,255,.95)":"rgba(185,156,255,"+(0.08+heat*0.32).toFixed(2)+")";
        ctx.fillRect(w*0.10+c*cw+1.5, h*0.20+r*ch+1.5, cw-3, ch-3);
      }
      ctx.strokeStyle="rgba(185,156,255,.5)"; ctx.lineWidth=1.5;
      ctx.strokeRect(w*0.10, h*0.20, w*0.80, h*0.62);
      ctx.fillStyle="rgba(185,156,255,.7)"; ctx.font='400 13px "Space Mono",monospace';
      ctx.textAlign="left"; ctx.fillText("RETRIEVED", w*0.10, h*0.14);
    }
  },
  {
    id: "CRT-09", name: "Critic", role: "Verification",
    color: 0xFF7D8A,
    desc: "A second pass that checks the work instead of trusting it. Cheap to add, and the single biggest quality lever in a swarm — an unverified agent is confidently wrong at scale. It should be allowed to send work back.",
    io: ["in: result", "out: verdict"],
    draw(ctx,w,h,t,S){
      ctx.fillStyle="#140609"; ctx.fillRect(0,0,w,h);
      const n=5;
      for(let i=0;i<n;i++){
        const y=h*(0.14+i*0.18);
        const phase=(t*0.55+i*0.31)%3;
        const judged=phase>1.0;
        const pass=((i*7)%3)!==0;
        ctx.strokeStyle="rgba(255,125,138,.25)"; ctx.lineWidth=1;
        ctx.strokeRect(w*0.10,y-11,w*0.58,22);
        ctx.fillStyle="rgba(255,125,138,"+(judged?0.5:0.18)+")";
        ctx.fillRect(w*0.10,y-11,w*0.58*Math.min(1,phase),22);
        if(judged){
          ctx.strokeStyle=pass?"#7DFFA8":"#FF7D8A"; ctx.lineWidth=3;
          ctx.beginPath();
          if(pass){ ctx.moveTo(w*0.76,y); ctx.lineTo(w*0.80,y+7); ctx.lineTo(w*0.88,y-8); }
          else { ctx.moveTo(w*0.77,y-7); ctx.lineTo(w*0.87,y+7);
                 ctx.moveTo(w*0.87,y-7); ctx.lineTo(w*0.77,y+7); }
          ctx.stroke();
        }
      }
    }
  }
];

/* ---------------- accessible DOM ---------------- */
const listEl = document.getElementById("blade-list");
const bBtns = [];
BLADES.forEach((b,i) => {
  const li=document.createElement("li");
  const btn=document.createElement("button");
  btn.className="blade-btn"; btn.type="button"; btn.dataset.i=String(i);
  btn.setAttribute("aria-expanded","false");
  const sr=document.createElement("span"); sr.className="sr";
  sr.innerHTML='<span class="b-name"></span><span class="b-role"></span><span class="b-desc"></span>';
  sr.querySelector(".b-name").textContent=b.name+" ("+b.id+")";
  sr.querySelector(".b-role").textContent=b.role+" · "+b.io.join(" · ");
  sr.querySelector(".b-desc").textContent=b.desc;
  btn.appendChild(sr); li.appendChild(btn); listEl.appendChild(li); bBtns.push(btn);
});

const mqReduce = matchMedia("(prefers-reduced-motion: reduce)");
let REDUCE = mqReduce.matches;
mqReduce.addEventListener?.("change", e => { REDUCE = e.matches; });

function webglOK(){
  try{ const c=document.createElement("canvas");
    return !!(window.WebGLRenderingContext && (c.getContext("webgl")||c.getContext("experimental-webgl")));
  }catch(_){ return false; }
}
function goFallback(){
  document.body.classList.add("fallback");
  const s=document.getElementById("stage"); if(s) s.remove();
  bBtns.forEach(b=>{ b.disabled=true; b.removeAttribute("aria-expanded");
    b.removeAttribute("style"); b.parentElement.removeAttribute("style"); });
}

let renderer, scene, camera, clock, blades=[], hazeGeo, haze;
const SW=384, SH=256;
const caption=document.getElementById("caption");
const note=document.getElementById("note");
let openIdx=-1, focusIdx=0, noteTimer=null;

function linearize(){
  scene.traverse(o=>{
    if(o.isLight&&o.color) o.color.convertSRGBToLinear();
    if(!o.isMesh&&!o.isPoints) return;
    const ms=Array.isArray(o.material)?o.material:[o.material];
    for(const m of ms){
      if(m&&m.color&&!m.userData._l){ m.color.convertSRGBToLinear(); m.userData._l=true; }
      if(m&&m.emissive&&!m.userData._e){ m.emissive.convertSRGBToLinear(); m.userData._e=true; }
    }
  });
}

function init(){
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById("gl"),antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setSize(innerWidth,innerHeight,false);
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.0;

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x06080C);
  scene.fog=new THREE.Fog(0x06080C,6,22);
  camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,60);
  clock=new THREE.Clock();
  scene.add(new THREE.AmbientLight(0x18202C,0.55));

  buildRoom(); buildRack(); buildSideRacks(); buildHaze();
  linearize(); layout();
  addEventListener("resize",layout,{passive:true});
  document.body.classList.add("lit");
  setCaption(0);
  renderer.setAnimationLoop(tick);
}

function buildRoom(){
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),
    new THREE.MeshStandardMaterial({color:0x0A0D13,roughness:0.32,metalness:0.55,
      transparent:true,opacity:0.86}));
  floor.rotation.x=-Math.PI/2; floor.renderOrder=2; scene.add(floor);
  const wall=new THREE.MeshStandardMaterial({color:0x080B11,roughness:0.95});
  const back=new THREE.Mesh(new THREE.PlaneGeometry(30,9),wall);
  back.position.set(0,4.5,-6); scene.add(back);
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(30,16),wall);
  ceil.rotation.x=Math.PI/2; ceil.position.y=4.2; scene.add(ceil);
}

const BLADE_H=0.34, BLADE_W=2.30;

function buildRack(){
  const n=BLADES.length;
  const cabH=n*BLADE_H+0.30;
  const metal=new THREE.MeshStandardMaterial({color:0x14181F,roughness:0.55,metalness:0.45});
  const dark=new THREE.MeshStandardMaterial({color:0x0C0F14,roughness:0.7,metalness:0.3});

  const body=new THREE.Mesh(new THREE.BoxGeometry(BLADE_W+0.22,cabH,0.9),dark);
  body.position.set(0,cabH/2,0); scene.add(body);
  for(const s of [-1,1]){
    const rail=new THREE.Mesh(new THREE.BoxGeometry(0.06,cabH,0.94),metal);
    rail.position.set(s*(BLADE_W/2+0.10),cabH/2,0.02); scene.add(rail);
  }

  BLADES.forEach((b,i)=>{
    const y=cabH-0.15-BLADE_H/2-i*BLADE_H;
    const g=new THREE.Group();
    g.position.set(0,y,0.46);

    const face=new THREE.Mesh(new THREE.BoxGeometry(BLADE_W,BLADE_H-0.03,0.10),
      new THREE.MeshStandardMaterial({color:0x1A1F28,roughness:0.5,metalness:0.5}));
    g.add(face);

    /* vent slots */
    for(let v=0;v<10;v++){
      const slot=new THREE.Mesh(new THREE.BoxGeometry(0.035,BLADE_H*0.42,0.02),
        new THREE.MeshStandardMaterial({color:0x05070A,roughness:0.9}));
      slot.position.set(-BLADE_W*0.40+v*0.048,0,0.052); g.add(slot);
    }

    /* status LEDs — the room's ambient nervous tic */
    const leds=[];
    for(let k=0;k<6;k++){
      const led=new THREE.Mesh(new THREE.BoxGeometry(0.028,0.028,0.012),
        new THREE.MeshBasicMaterial({color:b.color}));
      led.position.set(BLADE_W*0.40-k*0.055,BLADE_H*0.22,0.055);
      g.add(led); leds.push(led);
    }

    /* the blade's own little screen */
    const cv=document.createElement("canvas"); cv.width=SW; cv.height=SH;
    const cx=cv.getContext("2d");
    cx.fillStyle="#050A12"; cx.fillRect(0,0,SW,SH);
    const tex=new THREE.CanvasTexture(cv); tex.encoding=THREE.sRGBEncoding;
    const smat=new THREE.MeshBasicMaterial({map:tex});
    const screen=new THREE.Mesh(new THREE.PlaneGeometry(0.58,0.20),smat);
    screen.position.set(-BLADE_W*0.13,-BLADE_H*0.06,0.053);
    g.add(screen);

    const label=makeLabel(b);
    label.position.set(BLADE_W*0.235,-BLADE_H*0.10,0.053);
    g.add(label);

    scene.add(g);

    const light=new THREE.PointLight(b.color,0.75,3.4,2);
    light.position.set(0,y,0.95); scene.add(light);

    blades.push({ data:b, group:g, screen, smat, ctx:cx, tex, leds, light,
      restZ:0.46, slide:new Spring(0,120,20), state:{},
      el:bBtns[i].parentElement, btn:bBtns[i], hover:0 });
  });
}

function makeLabel(b){
  const c=document.createElement("canvas"); c.width=512; c.height=128;
  const x=c.getContext("2d");
  x.fillStyle="rgba(0,0,0,0)"; x.clearRect(0,0,512,128);
  x.textAlign="left"; x.textBaseline="middle";
  x.fillStyle="#"+b.color.toString(16).padStart(6,"0");
  x.font='700 44px "Space Grotesk",sans-serif';
  x.fillText(b.name.toUpperCase(),8,44);
  x.fillStyle="rgba(160,180,200,.75)";
  x.font='400 26px "Space Mono",monospace';
  x.fillText(b.id+"  ·  "+b.role.toUpperCase(),8,92);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
  return new THREE.Mesh(new THREE.PlaneGeometry(0.86,0.215),
    new THREE.MeshBasicMaterial({map:t,transparent:true}));
}

/* side racks, purely for depth — never lit, never interactive */
function buildSideRacks(){
  const mat=new THREE.MeshStandardMaterial({color:0x0B0E14,roughness:0.7,metalness:0.35});
  for(const s of [-1,1]) for(let i=0;i<4;i++){
    const g=new THREE.Group();
    g.position.set(s*(2.5+i*0.30),0,-1.4-i*1.55);
    g.rotation.y=-s*0.30;
    const body=new THREE.Mesh(new THREE.BoxGeometry(1.0,2.3,0.85),mat);
    body.position.y=1.15; g.add(body);
    for(let k=0;k<9;k++){
      const strip=new THREE.Mesh(new THREE.BoxGeometry(0.86,0.05,0.02),
        new THREE.MeshBasicMaterial({color:0x2E4A66}));
      strip.position.set(0,0.35+k*0.22,0.44); g.add(strip);
    }
    scene.add(g);
  }
}

function buildHaze(){
  const N=200, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]=(Math.random()-.5)*10;
    pos[i*3+1]=Math.random()*3.4;
    pos[i*3+2]=(Math.random()-.5)*7-1;
  }
  hazeGeo=new THREE.BufferGeometry();
  hazeGeo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  haze=new THREE.Points(hazeGeo,new THREE.PointsMaterial({
    color:0x8FC5E8,size:0.016,sizeAttenuation:true,transparent:true,
    opacity:0.18,depthWrite:false,blending:THREE.AdditiveBlending}));
  scene.add(haze);
}

function Spring(v,k,d){ this.x=v; this.v=0; this.t=v; this.k=k; this.d=d; }
Spring.prototype.step=function(dt){
  if(REDUCE){ this.x=this.t; this.v=0; return this.x; }
  const n=Math.min(4,Math.ceil(dt/0.012))||1, h=dt/n;
  for(let i=0;i<n;i++){ const a=this.k*(this.t-this.x)-this.d*this.v; this.v+=a*h; this.x+=this.v*h; }
  return this.x;
};

let camBase=new THREE.Vector3(), camLook=new THREE.Vector3();
const look={x:0,y:0,tx:0,ty:0};

function layout(){
  renderer.setSize(innerWidth,innerHeight,false);
  const aspect=innerWidth/Math.max(1,innerHeight);
  camera.aspect=aspect; camera.updateProjectionMatrix();
  const dist=4.3*Math.min(1.75,Math.max(1,1.10/aspect));
  camBase.set(0,1.30,dist);
  camLook.set(0,0.95,0);
  camera.position.copy(camBase); camera.lookAt(camLook);
  scene.fog.near=dist*0.95; scene.fog.far=dist*4.5;
}

function setCaption(i){
  focusIdx=i;
  const b=BLADES[i];
  caption.innerHTML="";
  const a=document.createElement("span");
  a.textContent=b.id+" · "+b.name.toUpperCase();
  a.style.color="#"+b.color.toString(16).padStart(6,"0");
  const c=document.createElement("span");
  c.textContent="  "+b.role; c.style.color="var(--muted)";
  caption.append(a,c);
}

function buildNote(b){
  note.innerHTML="";
  const h=document.createElement("div"); h.className="n-head";
  h.textContent=b.id+" · "+b.role; note.appendChild(h);
  const t=document.createElement("h3"); t.textContent=b.name; note.appendChild(t);
  const p=document.createElement("p"); p.textContent=b.desc; note.appendChild(p);
  const io=document.createElement("div"); io.className="n-io";
  b.io.forEach(s=>{ const e=document.createElement("span"); e.textContent=s; io.appendChild(e); });
  note.appendChild(io);
}

function openBlade(i){
  if(openIdx===i) return;
  if(openIdx>=0) bBtns[openIdx].setAttribute("aria-expanded","false");
  openIdx=i;
  blades.forEach((bl,k)=>{ bl.slide.t=(k===i)?1:0; if(REDUCE){bl.slide.x=bl.slide.t;bl.slide.v=0;} });
  bBtns[i].setAttribute("aria-expanded","true");
  setCaption(i); buildNote(BLADES[i]);
  clearTimeout(noteTimer);
  noteTimer=setTimeout(()=>{ if(openIdx===i) note.classList.add("show"); },REDUCE?0:260);
}
function closeBlade(){
  if(openIdx<0) return;
  bBtns[openIdx].setAttribute("aria-expanded","false");
  openIdx=-1; clearTimeout(noteTimer); note.classList.remove("show");
  blades.forEach(bl=>{ bl.slide.t=0; if(REDUCE){bl.slide.x=0;bl.slide.v=0;} });
}

let elapsed=0, screenAcc=0;
const projV=new THREE.Vector3(), projU=new THREE.Vector3(), camUp=new THREE.Vector3();

function tick(){
  const dt=Math.min(0.05,clock.getDelta());
  elapsed+=dt;

  screenAcc+=dt;
  if(screenAcc>=1/15){
    screenAcc=0;
    for(const bl of blades){
      if(REDUCE&&bl.painted) continue;
      bl.data.draw(bl.ctx,SW,SH,elapsed,bl.state);
      bl.tex.needsUpdate=true; bl.painted=true;
    }
  }

  blades.forEach((bl,i)=>{
    const s=bl.slide.step(dt);
    bl.group.position.z=bl.restZ+s*0.42;
    const emphasis=Math.max(s,bl.hover);
    bl.smat.color.setScalar(0.85+emphasis*0.35);
    bl.light.intensity=0.7+emphasis*1.9;
    /* LEDs blink independently — each blade keeps its own rhythm */
    bl.leds.forEach((led,k)=>{
      const on=REDUCE?1:(Math.sin(elapsed*(2.1+k*0.7)+i*1.3+k)>0.15?1:0.12);
      led.material.color.setScalar(0.25+on*0.9);
    });
  });

  if(!REDUCE){
    const p=hazeGeo.attributes.position.array;
    for(let i=0;i<p.length;i+=3){
      p[i+1]+=dt*0.035;
      p[i]+=Math.sin(elapsed*0.25+i)*dt*0.015;
      if(p[i+1]>3.6) p[i+1]=0.05;
    }
    hazeGeo.attributes.position.needsUpdate=true;
    look.x+=(look.tx-look.x)*(1-Math.exp(-2.3*dt));
    look.y+=(look.ty-look.y)*(1-Math.exp(-2.3*dt));
    camera.position.set(camBase.x+look.x*0.42,camBase.y+look.y*0.20,camBase.z);
    camera.lookAt(camLook.x+look.x*0.14,camLook.y+look.y*0.07,camLook.z);
  }

  project();
  renderer.render(scene,camera);
}

function project(){
  const W=innerWidth,H=innerHeight;
  camUp.setFromMatrixColumn(camera.matrixWorld,1).normalize();
  blades.forEach(bl=>{
    bl.group.getWorldPosition(projV);
    projU.copy(projV).addScaledVector(camUp,BLADE_H/2);
    projV.project(camera); projU.project(camera);
    const behind=projV.z>1;
    const x=(projV.x*0.5+0.5)*W, y=(-projV.y*0.5+0.5)*H;
    const half=Math.max(12,Math.abs((-projU.y*0.5+0.5)*H-y));
    const wPx=Math.max(80,half*2*(BLADE_W/BLADE_H)*0.86), hPx=Math.max(30,half*2.05);
    bl.el.style.width=wPx+"px"; bl.el.style.height=hPx+"px";
    bl.el.style.transform="translate("+(x-wPx/2).toFixed(1)+"px,"+(y-hPx/2).toFixed(1)+"px)";
    bl.el.style.zIndex=String(Math.round((1-projV.z)*10000));
    bl.btn.tabIndex=behind?-1:0;
    bl.btn.style.display=behind?"none":"";
  });

  if(openIdx>=0){
    const bl=blades[openIdx];
    bl.group.getWorldPosition(projV); projV.project(camera);
    const x=(projV.x*0.5+0.5)*W, y=(-projV.y*0.5+0.5)*H;
    /* the note sits beside the blade, not over it — the blade is the visual */
    note.style.left=Math.min(W-20,Math.max(20,x))+"px";
    note.style.top=Math.min(H-140,Math.max(150,y+H*0.22))+"px";
  }
}

bBtns.forEach((b,i)=>{
  b.addEventListener("mouseenter",()=>{ blades[i].hover=1; if(openIdx<0) setCaption(i); });
  b.addEventListener("mouseleave",()=>{ blades[i].hover=0; });
  b.addEventListener("focus",()=>{ blades[i].hover=1; if(openIdx<0) setCaption(i); });
  b.addEventListener("blur",()=>{ blades[i].hover=0; });
  b.addEventListener("click",()=>{ openIdx===i?closeBlade():openBlade(i); });
});

addEventListener("pointermove",e=>{
  look.tx=(e.clientX/innerWidth-0.5)*2;
  look.ty=(e.clientY/innerHeight-0.5)*2;
},{passive:true});

addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(openIdx>=0){ const i=openIdx; closeBlade(); bBtns[i].focus(); } return; }
  if(e.key==="ArrowDown"){ e.preventDefault(); bBtns[(focusIdx+1)%BLADES.length].focus(); }
  if(e.key==="ArrowUp"){ e.preventDefault(); bBtns[(focusIdx-1+BLADES.length)%BLADES.length].focus(); }
});

function boot(){
  if(!window.THREE||!webglOK()){ goFallback(); return; }
  try{ init(); }catch(err){ console.error("[machine-room] init failed:",err); goFallback(); }
}
if(document.fonts&&document.fonts.ready){
  let d=false; const go=()=>{ if(!d){ d=true; boot(); } };
  document.fonts.ready.then(go); setTimeout(go,2500);
} else boot();
</script>
</body>
